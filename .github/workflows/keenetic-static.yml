name: Keenetic static dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/keenetic/**'
      - '.github/workflows/keenetic-static.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Build Keenetic dashboard artifact
        run: ./scripts/keenetic/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: zashboard-keenetic-cdn
          path: dist/keenetic/*
          if-no-files-found: error
